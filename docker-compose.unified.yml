services:
  rescueai-unified:
    build:
      context: .
      dockerfile: Dockerfile
    image: rescueai/unified:latest
    container_name: rescueai-unified
    ports:
      - "${UNIFIED_UI_PORT:-8010}:8010"
    environment:
      UNIFIED_DETECTION_URL: "${UNIFIED_DETECTION_URL:-http://127.0.0.1:8001}"
      UNIFIED_RPI_SOURCE_URL: "${UNIFIED_RPI_SOURCE_URL:-http://127.0.0.1:9100}"
      NAV_MATCHER: "${NAV_MATCHER:-legacy}"
      XFEAT_INTEGRATION_MODE: "${XFEAT_INTEGRATION_MODE:-assist}"
      XFEAT_TOP_K: "${XFEAT_TOP_K:-800}"
      XFEAT_LIGHTERGLUE_MIN_CONF: "${XFEAT_LIGHTERGLUE_MIN_CONF:-0.25}"
      XFEAT_MAX_MATCHES: "${XFEAT_MAX_MATCHES:-300}"
      XFEAT_MOTION_GATE_PX: "${XFEAT_MOTION_GATE_PX:-35}"
      XFEAT_RANSAC_THR: "${XFEAT_RANSAC_THR:-2.0}"
      XFEAT_ASSIST_MIN_LEGACY_PTS: "${XFEAT_ASSIST_MIN_LEGACY_PTS:-0}"
      XFEAT_AUTO_BOOTSTRAP: "${XFEAT_AUTO_BOOTSTRAP:-1}"
      XFEAT_REPO_DIR: "${XFEAT_REPO_DIR:-}"
      XFEAT_GIT_REF: "${XFEAT_GIT_REF:-main}"
      NAV_MATCHER_DEBUG: "${NAV_MATCHER_DEBUG:-0}"
      NAV_MATCHER_DEBUG_EVERY_N: "${NAV_MATCHER_DEBUG_EVERY_N:-30}"
      NAV_MATCHER_DEBUG_MAX_PAIRS: "${NAV_MATCHER_DEBUG_MAX_PAIRS:-4}"
      NAV_MATCHER_DEBUG_DIR: "${NAV_MATCHER_DEBUG_DIR:-}"
      DET_DEVICE: "${DET_DEVICE:-cpu}"
      NANODET_ONNX: "${NANODET_ONNX:-0}"
      REQUIRE_NANODET_PTH: "${REQUIRE_NANODET_PTH:-1}"
      REQUIRE_NANODET_ONNX: "${REQUIRE_NANODET_ONNX:-0}"
      REQUIRE_YOLO_ONNX: "${REQUIRE_YOLO_ONNX:-0}"
      NSU_LOCAL_FRAMES_DIR: "${NSU_LOCAL_FRAMES_DIR:-/app/public/images}"
      NSU_LOCAL_FRAMES_COCO: "${NSU_LOCAL_FRAMES_COCO:-/app/public/annotations/val_from_labels.json}"
      YOLO_WEIGHTS_PATH: "${YOLO_WEIGHTS_PATH:-/app/models/yolov8n_baseline_multiscale.pt}"
      YOLO_ONNX_PATH: "${YOLO_ONNX_PATH:-/app/models/yolov8n_baseline_multiscale.onnx}"
      NANODET_CONFIG: "${NANODET_CONFIG:-/app/nanodet/config/nanodet-plus-m-1.5x_416.yml}"
      NANODET_WEIGHTS: "${NANODET_WEIGHTS:-/app/nanodet/nanodet/model/weights/nanodet-plus-m-1.5x_416.pth}"
      NANODET_ONNX_PATH: "${NANODET_ONNX_PATH:-/app/nanodet/nanodet/model/weights/nanodet-plus-m-1.5x_416.onnx}"
      YOLO_WEIGHTS_URL: "${YOLO_WEIGHTS_URL:-}"
      YOLO_ONNX_URL: "${YOLO_ONNX_URL:-}"
      NANODET_PTH_URL: "${NANODET_PTH_URL:-}"
      NANODET_ONNX_URL: "${NANODET_ONNX_URL:-}"
      NANODET_CONFIG_URL: "${NANODET_CONFIG_URL:-}"
      RPI_VIDEO_DIR: "${RPI_VIDEO_DIR:-/home/pi/Documents/test_videos}"
      RPI_MISSIONS_DIR: "${RPI_MISSIONS_DIR:-/home/pi/Documents/missions}"
      RPI_RTSP_HOST: "${RPI_RTSP_HOST:-}"
      RPI_RTSP_PORT: "${RPI_RTSP_PORT:-8554}"
      RPI_RTSP_PATH_PREFIX: "${RPI_RTSP_PATH_PREFIX:-live}"
      RPI_RTSP_ENABLE: "${RPI_RTSP_ENABLE:-1}"

    volumes:
      - ./models:/app/models
      - ./nanodet/nanodet/model/weights:/app/nanodet/nanodet/model/weights
      - rescueai_runtime:/app/runtime
      - ./public:/app/public
    restart: unless-stopped

volumes:
  rescueai_runtime:
